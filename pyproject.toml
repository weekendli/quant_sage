[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantsage-discovery"
version = "0.1.0"
description = "A reproducible workflow engine for empirical discovery"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "duckdb>=1.1,<2",
  "pyarrow>=18,<27",
  "pycatch22==0.4.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
quantsage = "quantsage_discovery.cli:main"
quantsage-onboard = "quantsage_discovery.onboarding:main"

[tool.setuptools.packages.find]
include = ["quantsage_discovery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
