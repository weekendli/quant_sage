# Example configuration / desired contract; no adapter implementation exists yet.
# Targets raw L2 fields documented in references/gov_bond_l2.schema.md.
# Physical names verified against references/part-0.parquet (3,178,989 rows, 66 columns).
# Calendar provider is Marketdata LAN API; calendar ID and intraday sessions need confirmation.
# This is government bond FUTURES L2 data, not cash-bond quotes.
project: quantsage_empirical_discovery
seed: 42
storage:
  raw_uri: ./data/raw
  artifacts_uri: ./artifacts
  registry_uri: ./artifacts/registry.sqlite
  temporary_uri: ./artifacts/tmp
resources:
  memory_limit: 8GB
  threads: 4
  max_concurrent_stages: 2
  max_feature_candidates: 40
  max_cube_cells_per_hypothesis: 24
input:
  format: parquet
  schema_ref: ./docs/references/gov_bond_l2.schema.json
  adapter: l2_snapshots # desired adapter; implementation does not exist yet
  exchange_timezone: Asia/Shanghai
  instrument_column: SYMBOL
  timestamp_column: TRADINGTIME
  available_timestamp_column: null # flag unknown; do not silently assume zero latency
  timestamp_kind: exchange_event_time
  columns:
    trade_date: TRADINGDATE
    exchange: MARKET
    bid_price_1: BUYPRICE01
    bid_price_2: BUYPRICE02
    bid_price_3: BUYPRICE03
    bid_price_4: BUYPRICE04
    bid_price_5: BUYPRICE05
    ask_price_1: SELLPRICE01
    ask_price_2: SELLPRICE02
    ask_price_3: SELLPRICE03
    ask_price_4: SELLPRICE04
    ask_price_5: SELLPRICE05
    bid_size_1: BUYVOLUME01
    bid_size_2: BUYVOLUME02
    bid_size_3: BUYVOLUME03
    bid_size_4: BUYVOLUME04
    bid_size_5: BUYVOLUME05
    ask_size_1: SELLVOLUME01
    ask_size_2: SELLVOLUME02
    ask_size_3: SELLVOLUME03
    ask_size_4: SELLVOLUME04
    ask_size_5: SELLVOLUME05
    last_price: LASTPRICE
    volume: TOTALVOLUME
    turnover: TOTALAMOUNT
    open_interest: TOTALPOSITION
    volume_increment: TRADEVOLUME
    turnover_increment: TRADEAMOUNT
    source_event_unix_ms: UNIX
  volume_semantics: cumulative_day # TOTALVOLUME; TRADEVOLUME is already incremental
  allow_research_only_without_availability: true
market:
  asset_class: government_bond_futures
  calendar_id: null # discover real IDs and confirm the CFFEX futures calendar; never default to CN_STOCK
  calendar_source:
    provider: marketdata_api
    base_url: https://192.168.1.102/marketdata-api/
    ca_file: null # configure the trusted server-ca.crt path on this client
    table: marketdata.reference.calendars
    max_rows: 10000 # reject truncation or fetch complete bounded pages
    freeze_snapshot: true
  session_rules_ref: null # verified API-derived or explicit versioned intraday rules; dates alone are insufficient
  max_quote_staleness: 2s
  prevent_cross_session_fill: true
splits:
  method: chronological
  # Placeholder bounds do not cover the January 2026 sample.
  # Replace with a validated SplitManifest before executing; do not invent a holdout from this file.
  train: {start: '2024-01-01', end: '2024-06-30'}
  development: {start: '2024-07-01', end: '2024-09-30'}
  final_holdout: {start: '2024-10-01', end: '2024-12-31'}
  embargo: 30m
research:
  mode: observatory
  time_bases: [clock_time, quote_event_count]
  windows: [10s, 30s, 1m, 5m]
  quote_event_windows: [20, 100]
  outcomes: [mid_return, future_realized_volatility]
  horizons: [1m, 5m, 30m]
baselines:
  fit_on: train
  group_by: [instrument_id, session_bucket]
  min_group_observations: 200
  quantiles: [0.01, 0.05, 0.5, 0.95, 0.99]
events:
  enabled_detectors: [extreme, divergence, online_change]
  cooldown: 30s
  session_reset: true
regimes:
  enabled: [rule_based]
  forbid_future_smoothed_states: true
cube:
  search: adaptive_beam
  maximum_ast_depth: 3
  max_cells_per_hypothesis: 24
validation:
  unit: event_episode
  bootstrap_unit: trading_day
  holdout_access: frozen_only
  multiple_testing: bh_fdr
  preserve_search_ledger: true
